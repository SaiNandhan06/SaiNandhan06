<svg width="920" height="300" viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091519"/>
      <stop offset="60%" stop-color="#0d2530"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="lineFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="#3a8296"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a8296" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a8296" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowBright" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#61DAFB" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="920" height="300" rx="16" fill="url(#bg)"/>
  <rect width="920" height="300" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="918" height="298" rx="15" fill="none" stroke="#3a8296" stroke-opacity="0.4"/>

  <text x="30" y="34" font-family="Consolas, Menlo, monospace" font-size="15" fill="#61DAFB">
    M. Sai Nandhan <tspan fill="#3a8296">// exploring RAG systems</tspan>
  </text>
  <text x="890" y="34" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#3a8296">
    AI Full-Stack Developer
  </text>

  <path id="p1" d="M100,175 L235,175" stroke="#1c3d45" stroke-width="2" fill="none"/>
  <path id="p2" d="M295,175 L430,175" stroke="#1c3d45" stroke-width="2" fill="none"/>
  <path id="p3" d="M490,175 L625,175" stroke="#1c3d45" stroke-width="2" fill="none"/>
  <path id="p4" d="M685,175 L800,175" stroke="#1c3d45" stroke-width="2" fill="none"/>
  <path id="loop" d="M780,205 C 780,262 260,262 260,205" stroke="#163038" stroke-width="1.5" fill="none" stroke-dasharray="4 5"/>

  <circle r="5" fill="url(#lineFlow)" filter="url(#softGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion></circle>
  <circle r="5" fill="url(#lineFlow)" filter="url(#softGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.55s"><mpath href="#p2"/></animateMotion></circle>
  <circle r="5" fill="url(#lineFlow)" filter="url(#softGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#p3"/></animateMotion></circle>
  <circle r="5" fill="#61DAFB" filter="url(#softGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.65s"><mpath href="#p4"/></animateMotion></circle>
  <circle r="4" fill="#8fe3c7" opacity="0.85"><animateMotion dur="4.4s" repeatCount="indefinite" begin="2.2s"><mpath href="#loop"/></animateMotion></circle>

  <g transform="translate(70,175)">
    <circle r="26" fill="url(#nodeGlow)"><animate attributeName="r" values="24;30;24" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="20" fill="#0a1a20" stroke="#3a8296" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-size="16">💬</text>
    <text y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8fd4e8">query</text>
  </g>
  <g transform="translate(265,175)">
    <circle r="26" fill="url(#nodeGlow)"><animate attributeName="r" values="24;30;24" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle r="20" fill="#0a1a20" stroke="#3a8296" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-size="16">🧬</text>
    <text y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#8fd4e8">embed()</text>
  </g>
  <g transform="translate(460,175)">
    <circle r="26" fill="url(#nodeGlowBright)"><animate attributeName="r" values="24;30;24" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="20" fill="#0a1a20" stroke="#61DAFB" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-size="16">🗄️</text>
    <text y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#c8e1ff">vector db</text>
  </g>
  <g transform="translate(655,175)">
    <circle r="26" fill="url(#nodeGlowBright)"><animate attributeName="r" values="24;30;24" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="20" fill="#0a1a20" stroke="#61DAFB" stroke-width="1.5"/>
    <text y="6" text-anchor="middle" font-size="16">🔎</text>
    <text y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#c8e1ff">top_k</text>
  </g>
  <g transform="translate(830,175)">
    <circle r="30" fill="url(#nodeGlowBright)"><animate attributeName="r" values="28;36;28" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="23" fill="#0a1a20" stroke="#61DAFB" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-size="18">🤖</text>
    <text y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#61DAFB">LLM</text>
  </g>

  <text x="460" y="290" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2c5560">
    context flows back into the next turn ↻
  </text>
</svg>
